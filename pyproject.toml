[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manychat-claude-reply-bridge"
version = "0.1.0"
description = "A secure HTTPS endpoint that lets a ManyChat flow (External Request or Dynamic Block) get an answer from Claude: knowledge-base answers with sources, lead qualification into custom fields and tags, human handover, opt-out, all inside ManyChat's 10-second limit."
requires-python = ">=3.10"
license = "MIT"
dependencies = ["anthropic>=2.9,<3", "fastapi>=0.110", "httpx>=0.27", "PyYAML>=6.0", "uvicorn>=0.29"]

[project.scripts]
mc-bridge = "mc_bridge.cli:main"

[tool.setuptools]
packages = ["mc_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:You should not use the 'timeout' argument with the TestClient"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "E731"]
